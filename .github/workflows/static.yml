name: Deploy Vue to GitHub Pages

# 触发条件：main 分支推送代码时执行
on:
  push:
    branches: [ main ]

# 权限配置：允许写入 Pages 资源
permissions:
  contents: read
  pages: write
  id-token: write

# 并发控制：取消正在进行的部署，只保留最新一次
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取仓库代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 配置 Node.js 环境（适配 Vue 项目）
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # 匹配本地 Node 版本，避免打包报错
          cache: 'npm' # 缓存依赖，加速构建

      # 3. 安装项目依赖
      - name: Install Dependencies
        run: npm install

      # 4. 打包 Vue 项目（生成 dist 文件夹）
      - name: Build Project
        run: npm run build

      # 5. 配置 GitHub Pages 部署环境
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # 6. 上传 dist 文件夹作为部署产物
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist # 关键：指定 Vue 打包后的静态文件目录

      # 7. 完成部署
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
